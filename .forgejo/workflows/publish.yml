name: Publish NuGet

# Release mechanism: push a v*.*.* tag. GitHub is a sync mirror; publishing runs here.
# No setup-dotnet, setup-java or workload install: the ubuntu-latest runner image
# carries the .NET 11 SDK, the maui-android workload, JDK 21 and the Android SDK,
# which is all the Binding package needs to pack.

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CONFIGURATION: Release
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish:
    name: Build, Pack and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore
        run: dotnet restore CheapBarcodes.Scanning/CheapBarcodes.Scanning.csproj

      - name: Run tests
        run: dotnet test CheapBarcodes.Scanning.Tests/CheapBarcodes.Scanning.Tests.csproj --configuration ${{ env.CONFIGURATION }}

      - name: Pack
        run: |
          dotnet pack CheapBarcodes.Binding/CheapBarcodes.Binding.csproj --configuration ${{ env.CONFIGURATION }} --output ./nupkgs
          dotnet pack CheapBarcodes.Scanning/CheapBarcodes.Scanning.csproj --configuration ${{ env.CONFIGURATION }} --output ./nupkgs

      - name: Publish packages to NuGet.org
        run: |
          for pkg in ./nupkgs/*.nupkg; do
            echo "Publishing $pkg"
            dotnet nuget push "$pkg" --api-key "$NUGET_API_KEY" --source "$NUGET_SOURCE" --skip-duplicate
          done
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
