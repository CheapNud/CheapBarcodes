name: Build & Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No setup-dotnet and no workload install: the ubuntu-latest label maps to
      # the ci-dotnet image, which carries the .NET 11 SDK plus the maui-android
      # workload. Installing the workload per run broke twice when a fresh SDK
      # referenced android packs that nuget.org did not have yet.
      # No actions/cache: the runner mounts a persistent nuget-ci-cache volume
      # into every job, and the cache action only ever timed out here anyway.
      # The android flavor of the library is never BUILT here - building the
      # test project compiles only the net11.0 flavor.
      - name: Test
        run: dotnet test CheapBarcodes.Scanning.Tests/CheapBarcodes.Scanning.Tests.csproj --configuration Release --verbosity normal
